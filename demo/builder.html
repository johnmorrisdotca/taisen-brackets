<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Taisen Brackets: build a bracket and copy the code</title>
  <meta name="description" content="Choose the number of teams, the size, the look, the theme, the layout and a background, see the bracket, and copy the code that draws it." />
  <style>
    :root { color-scheme: light dark; --bg: #f6f4ee; --ink: #10151b; --muted: #434b54; --card: #fff; --line: #b9b3a3; --accent: #1f5fa8; --tab: #10151b; --tab-ink: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1218; --ink: #f6f3ea; --muted: #bcc3cb; --card: #18212a; --line: #475463; --accent: #7fb2ee; --tab: #f6f3ea; --tab-ink: #0d1218; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 32px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p { margin: 0 0 10px; max-width: 70ch; }
    .lede, .note { color: var(--muted); }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 900px) { .layout { grid-template-columns: 300px minmax(0, 1fr); align-items: start; } .controls { position: sticky; top: 8px; } }
    .controls { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .row { margin: 0 0 8px; }
    .row b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 3px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { font: inherit; font-size: .9rem; font-weight: 700; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    .chips button[aria-pressed="true"] { border-color: var(--tab); background: var(--tab); color: var(--tab-ink); }
    .stage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; overflow-x: auto; display: grid; justify-items: center; min-height: 240px; }
    .stage svg { max-width: 100%; height: auto; }
    kazoku-embed-panel { margin-top: 12px; --kazoku-ink: var(--ink); --kazoku-surface: var(--card); --kazoku-line: var(--line); --kazoku-accent: var(--accent); --kazoku-preview-width: 380px; }
  </style>
</head>
<body>
  <main>
    <p><a href="./">← The demo</a></p>
    <h1>Build a bracket, copy the code</h1>
    <p class="lede">Choose what you want and the bracket is drawn by the package, here, in your browser. The code under it draws the same one.</p>
    <div class="layout">
      <div class="controls" id="controls" data-testid="controls"></div>
      <div>
        <div class="stage" id="stage" data-testid="stage" role="img" aria-label="The bracket"></div>
        <kazoku-embed-panel id="embed-panel" no-size docs-href="docs/index.html" data-testid="embed-panel"></kazoku-embed-panel>
        <p class="note" style="margin-top:12px"><a href="https://github.com/johnmorrisdotca/taisen-brackets/blob/main/docs/guides/getting-started.md">Getting started</a> · <a href="https://github.com/johnmorrisdotca/taisen-brackets/blob/main/docs/guides/layouts-and-looks.md">Layouts, looks and backgrounds</a> · <a href="https://github.com/johnmorrisdotca/taisen-brackets/blob/main/docs/API.md">API reference</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="embed-panel.js"></script>
  <script type="module">
    // The builder: the number of teams, the size, the look, the theme, the layout and a background, each a row of buttons; the bracket is drawn with the package's own build
    // beside this page, from a tournament played out by a fixed rule (the same every time). Under it is the family's embed panel, with the code for each way a page is made. Nothing is sent or stored.
    import { advanceWinners, drawBracket, singleElimination } from "./dist/index.js";
    import { CHOICES, drawOptions, embedCode, frameCode, frameQuery, tournament } from "./embed-code.js";

    const T = { advanceWinners, singleElimination };
    const state = Object.fromEntries(Object.entries(CHOICES).map(([key, one]) => [key, one.default]));
    const query = new URLSearchParams(location.search);
    for (const [key, one] of Object.entries(CHOICES)) if (one.values.includes(query.get(key))) state[key] = query.get(key);
    const $ = (id) => document.getElementById(id);
    const panel = $("embed-panel");
    const KINDS = ["module", "html", "react", "vue", "angular", "svelte", "iframe"];

    /** The bracket as drawn now, and its size from its own viewBox. */
    function drawn() {
      const t = tournament(T, Number(state.teams));
      const svg = drawBracket({ teams: t.teams, matchups: t.matchups }, drawOptions(state));
      const box = /viewBox="0 0 (\d+(?:\.\d+)?) (\d+(?:\.\d+)?)"/.exec(svg);
      return { t, svg, width: box ? Math.round(Number(box[1])) : 960, height: box ? Math.round(Number(box[2])) : 540 };
    }

    function draw() {
      const now = drawn();
      $("stage").innerHTML = now.svg;
      for (const group of document.querySelectorAll("[data-choice]")) for (const button of group.querySelectorAll("button")) button.setAttribute("aria-pressed", String(button.dataset.value === state[group.dataset.choice]));
      panel.setAttribute("aspect", String(Math.round((now.height / now.width) * 1000) / 1000));
      panel.openHref = `embed.html?${frameQuery(state)}`;
      panel.update();
      document.body.dataset.ready = "true";
    }

    $("controls").replaceChildren(...Object.entries(CHOICES).map(([key, one]) => {
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("b");
      label.textContent = one.label;
      const chips = document.createElement("div");
      chips.className = "chips";
      chips.dataset.choice = key;
      chips.setAttribute("role", "group");
      chips.setAttribute("aria-label", one.label);
      for (const value of one.values) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.value = value;
        button.textContent = value;
        button.addEventListener("click", () => { state[key] = value; draw(); });
        chips.append(button);
      }
      row.append(label, chips);
      return row;
    }));

    panel.kinds = KINDS;
    panel.kind = KINDS.includes(query.get("embed")) ? query.get("embed") : "module";
    panel.labels = { module: "The call", html: "In a page" };
    panel.generate = ({ kind, preview }) => {
      if (kind === "iframe") {
        const now = drawn();
        return frameCode(state, now.width, now.height, preview);
      }
      return embedCode(kind, drawn().t, drawOptions(state)) ?? "";
    };
    panel.preview = ({ kind }) => {
      if (kind === "iframe") return undefined;
      const now = drawn();
      const box = document.createElement("div");
      box.style.cssText = `width: ${now.width}px; line-height: 0`;
      box.innerHTML = now.svg;
      box.querySelector("svg")?.setAttribute("style", "display: block; width: 100%; height: auto");
      return box;
    };
    panel.note = ({ kind }) => (kind === "iframe" ? "The embed page draws a sample knockout in the look, theme and size chosen here. For the layout, the background and your own games, use the call." : "");
    panel.credits = "Taisen Brackets 対戦 by John Morris (MIT). Every drawing is our own: no team's logo or mark.";
    panel.addEventListener("kazoku-embedchange", (event) => {
      const { kind, reason } = event.detail;
      if (reason === "init") return;
      const next = new URLSearchParams(location.search);
      if (kind === "module") next.delete("embed");
      else next.set("embed", kind);
      history.replaceState(history.state, "", `${location.pathname}${next.size ? `?${next}` : ""}`);
    });
    draw();
  </script>
</body>
</html>
